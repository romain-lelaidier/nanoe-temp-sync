[project]
name = "airtable_sync"
version = "0.1.0"
description = "Modular source-to-Airtable synchronization base"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alive-progress>=3.3.0",
    "colorlog>=6.12.0",
    "pandas>=3.0.6",
    "paramiko<4.0.0",
    "psycopg2-binary>=2.9.13",
    "pyairtable>=3.5.0.post1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.3",
    "schedule>=1.2.2",
    "sshtunnel>=0.4.0",
]

[project.scripts]
airtable-sync = "airtable_sync.cli:main"
